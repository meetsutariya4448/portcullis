services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: portcullis
      POSTGRES_PASSWORD: portcullis
      POSTGRES_DB: portcullis
    ports:
      # Remapped from the default 5432 -- a host postgres is often already
      # bound there. Containers on the compose network still reach this one
      # at postgres:5432; only the host-side port differs.
      - "15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      # Remapped from the default 6379 for the same reason as postgres above.
      - "16379:6379"

  # --- observability profile: local trace viewer -----------------------------
  # Not started by a plain `docker compose up`. Run with
  # `docker compose --profile observability up -d jaeger`, then point the
  # gateway at it with `tracing.enabled: true` and
  # `tracing.otlp_endpoint: "jaeger:4318"` (or "localhost:4318" if the
  # gateway itself is running outside compose) — see internal/tracing.
  jaeger:
    profiles: ["observability"]
    image: jaegertracing/all-in-one:1.60
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "4318:4318" # OTLP HTTP receiver
      - "16686:16686" # Jaeger UI

  # --- bench profile: gateway overhead benchmark harness --------------------
  # Not started by a plain `docker compose up`. Run with
  # `docker compose --profile bench up -d`, or via bench/run_bench.sh, which
  # does that for you. See bench/run_bench.sh for what each service is used
  # to measure.

  # CPU limits below are deliberate, not decorative: this profile runs up to
  # 5 of these containers concurrently (3 gateways + nginx + 1 upstream) on
  # an 8-core host, alongside `hey` itself and Docker Desktop's own VM
  # overhead. Without an explicit ceiling, docker compose lets every
  # container burst across all 8 cores freely, which masks true per-request
  # overhead behind scheduler contention. 1.0 cpu each keeps the "3 gateway
  # instances" scenario's total container demand (5 cores) inside what the
  # host can actually supply alongside its own overhead -- see
  # run_bench.sh's CPU-contention check, which drops the 3-instance result
  # from results.md if the numbers still show contention regardless.

  upstream-native:
    profiles: ["bench"]
    build: ./bench/upstream-native
    cpus: "1.0"
    ports:
      - "9101:9101"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:9101/healthz"]
      interval: 2s
      timeout: 2s
      retries: 15

  upstream-legacy:
    profiles: ["bench"]
    build: ./bench/upstream-legacy
    cpus: "1.0"
    ports:
      - "9102:9102"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:9102/healthz"]
      interval: 2s
      timeout: 2s
      retries: 15

  # Dedicated single-instance target for the "through 1 gateway instance"
  # measurement. Kept separate from gateway-a/b/c (below) so its session
  # pool never gets warmed by traffic meant for the 3-instance measurement,
  # or vice versa.
  gateway-solo:
    profiles: ["bench"]
    build: ./gateway
    command: ["-config", "/etc/portcullis/config.yaml", "-addr", ":8080"]
    cpus: "1.0"
    volumes:
      - ./bench/configs/gateway.yaml:/etc/portcullis/config.yaml:ro
    ports:
      - "8081:8080"
    depends_on:
      upstream-native:
        condition: service_healthy
      upstream-legacy:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:8080/healthz"]
      interval: 2s
      timeout: 2s
      retries: 15

  gateway-a:
    profiles: ["bench"]
    build: ./gateway
    command: ["-config", "/etc/portcullis/config.yaml", "-addr", ":8080"]
    cpus: "1.0"
    volumes:
      - ./bench/configs/gateway.yaml:/etc/portcullis/config.yaml:ro
    ports:
      - "8082:8080"
    depends_on:
      upstream-native:
        condition: service_healthy
      upstream-legacy:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:8080/healthz"]
      interval: 2s
      timeout: 2s
      retries: 15

  gateway-b:
    profiles: ["bench"]
    build: ./gateway
    command: ["-config", "/etc/portcullis/config.yaml", "-addr", ":8080"]
    cpus: "1.0"
    volumes:
      - ./bench/configs/gateway.yaml:/etc/portcullis/config.yaml:ro
    ports:
      - "8083:8080"
    depends_on:
      upstream-native:
        condition: service_healthy
      upstream-legacy:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:8080/healthz"]
      interval: 2s
      timeout: 2s
      retries: 15

  gateway-c:
    profiles: ["bench"]
    build: ./gateway
    command: ["-config", "/etc/portcullis/config.yaml", "-addr", ":8080"]
    cpus: "1.0"
    volumes:
      - ./bench/configs/gateway.yaml:/etc/portcullis/config.yaml:ro
    ports:
      - "8084:8080"
    depends_on:
      upstream-native:
        condition: service_healthy
      upstream-legacy:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:8080/healthz"]
      interval: 2s
      timeout: 2s
      retries: 15

  # Round-robin load balancer over gateway-a/b/c with no sticky sessions —
  # the "through 3 gateway instances" measurement target.
  nginx-bench:
    profiles: ["bench"]
    image: nginx:1.27-alpine
    cpus: "1.0"
    volumes:
      - ./bench/configs/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8090:80"
    depends_on:
      gateway-a:
        condition: service_healthy
      gateway-b:
        condition: service_healthy
      gateway-c:
        condition: service_healthy

volumes:
  postgres-data:
