[project]
name = "portcullis-control"
version = "0.1.0"
description = "Portcullis control plane: tool-poisoning scanner and evals"
requires-python = ">=3.12"
dependencies = [
    "certifi",
    "anthropic",
    "pydantic",
    "psycopg[binary]",
    "pgvector",
    "sentence-transformers",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# hatchling can't auto-detect a package layout here: "portcullis-control"
# doesn't normalize to any single directory name at the repo root (scanner/
# and evals/ are separate top-level packages, not one package named after
# the project). Declared explicitly instead of guessed.
packages = ["scanner"]

[tool.pytest.ini_options]
testpaths = ["scanner"]
