[project]
name = "portcullis-control"
version = "0.1.0"
description = "Portcullis control plane: tool-poisoning scanner and evals"
requires-python = ">=3.12"
dependencies = [
    "certifi",
    "anthropic",
    "pydantic",
    "psycopg[binary]",
    "pgvector",
    "sentence-transformers",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["scanner"]
