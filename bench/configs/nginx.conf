events {}

http {
    upstream portcullis_cluster {
        # Deliberately plain round robin: no ip_hash, no cookie affinity,
        # no sticky sessions of any kind. Portcullis instances are
        # stateless for 2026-07-28 traffic and pool their own legacy
        # sessions independently for 2025-11-25 traffic, so any instance
        # can take any request.
        server gateway-a:8080;
        server gateway-b:8080;
        server gateway-c:8080;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://portcullis_cluster;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
        }
    }
}
